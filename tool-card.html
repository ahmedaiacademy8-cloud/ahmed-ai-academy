<!-- Reference markup for one tool teaser card on the home route. -->
<div class="a-card" data-searchable>
  <div class="icon-tile">{{icon}}</div>
  <span class="level beginner">دليل كامل</span>
  <h3>{{name}} — الدليل الشامل</h3>
  <p>{{shortDescription}}</p>
  <a href="#tool/{{slug}}" class="go">اقرأ الدليل ←</a>
</div>
